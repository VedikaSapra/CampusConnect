<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%235141B8'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusConnect — Your Campus Community Hub</title>
  <!-- Prevent theme flash: apply class BEFORE React mounts -->
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('cc_theme_mode') || localStorage.getItem('cc_theme') || 'light';
        // Treat 'system' as 'light' since we removed system default
        if (pref === 'system') pref = 'light';
        if (pref === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
          document.documentElement.style.backgroundColor = '#11101A';
          document.body && (document.body.style.backgroundColor = '#11101A');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
          document.documentElement.style.backgroundColor = '#F8F7FC';
          document.body && (document.body.style.backgroundColor = '#F8F7FC');
        }
      } catch (e) { }
    })();
  </script>
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
